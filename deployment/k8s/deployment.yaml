apiVersion: apps/v1
kind: Deployment
metadata:
  name: transfoerm
spec:
  replicas: 3
  selector:
    matchLabels:
      app: transfoerm
  template:
    metadata:
      labels:
        app: transfoerm
    spec:
      containers:
      - name: transfoerm
        image: transfoerm:latest
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "production"
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: transfoerm-config
              key: DB_HOST
        resources:
          limits:
            cpu: "1"
            memory: "1Gi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5 